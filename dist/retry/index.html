<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 파지 실패 후 재시도로 배치 성공 · ReachBench</title>
<meta name="description" content="같은 초기 조건에서 재시도 설정만 바꾼 두 Python 실행을 같은 시간으로 재생합니다.">
<link rel="stylesheet" href="compare.css">
</head>
<body>
<header><div class="shell bar"><a href="../" class="brand">ReachBench</a><nav><a href="../">라이브 실험</a><a href="https://github.com/sokldjs554/reachbench/tree/main/docs/v3/retry-study">실험 원본</a></nav></div></header>
<main class="shell">
<div class="intro"><span class="eyebrow">PANDA / SEED 107</span><h1>첫 파지 실패 후 재시도로 배치 성공</h1><p>같은 큐브를 놓친 두 실행에서, 한쪽만 다시 집도록 허용했습니다.</p></div>
<p id="loading" role="status">실행 기록을 불러오는 중입니다.</p>
<section id="workbench" hidden aria-label="기록 비교">
<div class="meta"><strong>Python 시뮬레이션 기록</strong><span>기록된 관절·물체 자세로 장면 재구성</span></div>
<div class="pair" id="panels"></div>
<div class="transport"><button id="play" class="accent">재생</button><button id="reset">처음으로</button><div class="track"><label for="timeline" class="visually-hidden">두 실행의 공통 시각</label><input id="timeline" type="range" min="0" step=".01" value="0"><div class="markers" id="markers" aria-label="사건 위치"></div></div><output id="clock" for="timeline"></output></div>
<div class="jumps" id="jumps" aria-label="사건 시점으로 이동"></div>
<p class="finding" id="evaluation"></p>
</section>
<section id="inspector" hidden aria-labelledby="inspect-title">
<div class="inspector-head"><div><span class="eyebrow">RGB-D / CONTROL</span><h2 id="inspect-title">카메라 관측과 모터 명령</h2></div>
<label>실행 선택 <select id="mode"><option value="on">재시도 켬</option><option value="off">재시도 끔</option></select></label></div>
<p>사진을 누르면 해당 관측 시각으로 이동합니다.</p>
<div id="photos" class="photos"></div><h3 id="selected-observation"></h3><div id="alignment" class="alignment"></div>
<details><summary>7축 관절 상태와 명령 보기</summary><div id="joints"></div></details>
<div class="downloads"><a href="observations.jsonl" download>관측·행동 데이터 받기 (JSONL)</a><a href="https://github.com/sokldjs554/reachbench/blob/main/docs/v3/retry-study/ALIGNMENT.md">시간 정렬 기준</a></div>
</section>
</main>
<script type="module" src="compare.mjs"></script></body></html>
